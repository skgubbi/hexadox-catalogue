<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- BRAND HEADER -->

<header class="brand-header">

    <img src="images/hexadox-logo.png" 
         class="logo" 
         alt="HEXADOX Logo">

    <p class="subtitle">
        
    </p>

</header>



<!-- HERO TITLE -->

<header class="hero-title">

    <h1>WELCOME TO HEXADOX Pharmaceuticals</h1>

    <p>
        Dermatology Portfolio
    </p>

</header>




<!-- CATEGORY GLASS TABS -->

<div id="home" class="category-container">


<div class="glass category" 
onclick="openCategory('trichology')">

    <span class="icon">🧬</span>

    <span>
    Trichology Range
    </span>

</div>




<div class="glass category" 
onclick="openCategory('cosmetology')">

    <span class="icon">✨</span>

    <span>
    Cosmetology Range
    </span>

</div>




<div class="glass category" 
onclick="openCategory('clinical')">

    <span class="icon">⚕️</span>

    <span>
    Clinical Dermatology Range
    </span>

</div>


</div>






<!-- PRODUCT GALLERY -->

<div id="gallery" class="container hidden">


<button onclick="goHome()">
← Back
</button>


<div id="products" class="grid"></div>


</div>






<!-- IMAGE VIEWER -->

<div id="viewer" class="container hidden">


<button onclick="backGallery()">
← Back
</button>


<img id="largeImage">


</div>




<script src="script.js"></script>


</body>

</html>
